[workspace]
resolver = "2"
members = [
    "justoled",
    "bins/justoled-tap",
    "bins/just-oled",
]

[workspace.package]
version = "0.1.7"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = false
panic = "abort"

# One set of lints for every crate; CI denies warnings.
[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
